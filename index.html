<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Core — Reactor Station</title>
    <style>
      /* Reset — fills the viewport with no scrollbars */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      /* HUD overlay — sits on top of the Three.js canvas */
      #hud {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        font-family: 'Courier New', monospace;
        color: #ccc;
      }
      #hud * { pointer-events: auto; }

      /* Crosshair */
      #crosshair {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 20px; height: 20px;
        pointer-events: none;
      }
      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.6);
      }
      #crosshair::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
      #crosshair::after  { left: 50%; top: 0; height: 100%; width: 1px; transform: translateX(-50%); }

      /* FPS counter */
      #fps {
        position: absolute;
        top: 10px; left: 10px;
        font-size: 12px;
        color: #0f0;
        pointer-events: none;
      }

      /* Debug: active keys */
      #debug-keys {
        position: absolute;
        bottom: 10px; left: 10px;
        font-size: 11px;
        color: #888;
        pointer-events: none;
      }

      /* Level indicator */
      #level-indicator {
        position: absolute;
        top: 10px; right: 10px;
        font-size: 14px;
        pointer-events: none;
      }

      /* Menu overlay — covers the screen */
      #menu-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
      }
      #menu-overlay h1 {
        font-size: 48px;
        color: #e0e0e0;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      #menu-overlay .subtitle {
        font-size: 14px;
        color: #888;
        letter-spacing: 4px;
        margin-bottom: 40px;
      }
      #menu-overlay button {
        background: none;
        border: 1px solid #555;
        color: #ccc;
        font-family: 'Courier New', monospace;
        font-size: 16px;
        padding: 12px 40px;
        margin: 6px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: border-color 0.2s, color 0.2s;
      }
      #menu-overlay button:hover {
        border-color: #fff;
        color: #fff;
      }

      /* Pause overlay */
      #pause-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 20;
      }
      #pause-overlay h2 {
        font-size: 32px;
        color: #e0e0e0;
        letter-spacing: 6px;
        margin-bottom: 24px;
      }
      #pause-overlay button {
        background: none;
        border: 1px solid #555;
        color: #ccc;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        padding: 10px 32px;
        margin: 4px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: border-color 0.2s, color 0.2s;
      }
      #pause-overlay button:hover {
        border-color: #fff;
        color: #fff;
      }

      /* Loading screen */
      #loading-screen {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 30;
      }
      #loading-screen .loading-text {
        font-size: 14px;
        color: #666;
        letter-spacing: 4px;
        margin-bottom: 20px;
      }
      #loading-bar-container {
        width: 240px;
        height: 2px;
        background: #222;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #0af;
        transition: width 0.3s;
      }

      /* Health bar — bottom-left of HUD */
      #health-bar-wrap {
        position: absolute;
        bottom: 30px; left: 20px;
        width: 160px;
        pointer-events: none;
      }
      #health-bar-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: #f44;
        margin-bottom: 4px;
      }
      #health-bar-bg {
        width: 100%;
        height: 6px;
        background: #1a1a2e;
        border: 1px solid #334;
      }
      #health-bar-fill {
        width: 100%;
        height: 100%;
        background: #f44;
        transition: width 0.2s ease;
      }
    </style>
  </head>
  <body>
    <!-- Three.js canvas is appended here by the renderer -->
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="crosshair"></div>
      <div id="fps">-- FPS</div>
      <div id="debug-keys">Keys: none</div>
      <div id="level-indicator">LEVEL 1</div>

      <!-- Health bar -->
      <div id="health-bar-wrap">
        <div id="health-bar-label">HEALTH</div>
        <div id="health-bar-bg">
          <div id="health-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Main menu -->
    <div id="menu-overlay">
      <h1>The Core</h1>
      <div class="subtitle">Reactor Station</div>
      <button id="btn-start">Start Game</button>
      <button id="btn-credits">Credits</button>
    </div>

    <!-- Pause menu -->
    <div id="pause-overlay">
      <h2>Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart">Restart</button>
      <button id="btn-main-menu">Main Menu</button>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-text">Loading</div>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
