<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Core — Reactor Station</title>
    <style>
      /* Reset — fills the viewport with no scrollbars */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      /* HUD overlay — sits on top of the Three.js canvas */
      #hud {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        font-family: 'Courier New', monospace;
        color: #ccc;
      }
      #hud * { pointer-events: auto; }

      /* Crosshair */
      #crosshair {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 20px; height: 20px;
        pointer-events: none;
      }
      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.6);
      }
      #crosshair::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
      #crosshair::after  { left: 50%; top: 0; height: 100%; width: 1px; transform: translateX(-50%); }

      /* FPS counter */
      #fps {
        position: absolute;
        top: 10px; left: 10px;
        font-size: 12px;
        color: #0f0;
        pointer-events: none;
      }

      /* Debug: active keys */
      #debug-keys {
        position: absolute;
        bottom: 10px; left: 10px;
        font-size: 11px;
        color: #888;
        pointer-events: none;
      }

      /* Level indicator */
      #level-indicator {
        position: absolute;
        top: 10px; right: 10px;
        font-size: 14px;
        pointer-events: none;
      }

      /* Menu overlay — covers the screen */
      #menu-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
      }
      #menu-overlay h1 {
        font-size: 48px;
        color: #e0e0e0;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      #menu-overlay .subtitle {
        font-size: 14px;
        color: #888;
        letter-spacing: 4px;
        margin-bottom: 40px;
      }
      #menu-overlay button {
        background: none;
        border: 1px solid #555;
        color: #ccc;
        font-family: 'Courier New', monospace;
        font-size: 16px;
        padding: 12px 40px;
        margin: 6px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: border-color 0.2s, color 0.2s;
      }
      #menu-overlay button:hover {
        border-color: #fff;
        color: #fff;
      }

      /* Pause overlay */
      #pause-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 20;
      }
      #pause-overlay h2 {
        font-size: 32px;
        color: #e0e0e0;
        letter-spacing: 6px;
        margin-bottom: 24px;
      }
      #pause-overlay button {
        background: none;
        border: 1px solid #555;
        color: #ccc;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        padding: 10px 32px;
        margin: 4px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: border-color 0.2s, color 0.2s;
      }
      #pause-overlay button:hover {
        border-color: #fff;
        color: #fff;
      }

      /* Loading screen */
      #loading-screen {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 30;
      }
      #loading-screen .loading-text {
        font-size: 14px;
        color: #666;
        letter-spacing: 4px;
        margin-bottom: 20px;
      }
      #loading-bar-container {
        width: 240px;
        height: 2px;
        background: #222;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #0af;
        transition: width 0.3s;
      }

      /* Pulse Tool energy bar — bottom-right of HUD */
      #energy-bar-wrap {
        position: absolute;
        bottom: 30px; right: 20px;
        width: 160px;
        pointer-events: none;
      }
      #energy-bar-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: #0af;
        margin-bottom: 4px;
      }
      #energy-bar-bg {
        width: 100%;
        height: 6px;
        background: #1a1a2e;
        border: 1px solid #334;
      }

      /* Health bar — bottom-left of HUD */
      #health-bar-wrap {
        position: absolute;
        bottom: 30px; left: 20px;
        width: 160px;
        pointer-events: none;
      }
      #health-bar-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: #f44;
        margin-bottom: 4px;
      }
      #health-bar-bg {
        width: 100%;
        height: 6px;
        background: #1a1a2e;
        border: 1px solid #334;
      }
      #energy-bar-fill {
        width: 100%;
        height: 100%;
        background: #0af;
        transition: width 0.1s linear;
      }
      #energy-bar-wrap.cooldown #energy-bar-fill {
        background: #067;
      }
      #health-bar-fill {
        width: 100%;
        height: 100%;
        background: #f44;
        transition: width 0.2s ease;
      }

      /* Stealth vignette — red border that pulses when monster is near */
      #stealth-vignette {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center,
          transparent 50%,
          rgba(200, 0, 0, 0.3) 80%,
          rgba(200, 0, 0, 0.6) 100%
        );
        transition: opacity 0.3s ease;
      }
      #stealth-vignette.pulse {
        animation: vignette-pulse 0.8s ease-in-out infinite alternate;
      }
      @keyframes vignette-pulse {
        from { opacity: var(--vignette-base, 0); }
        to   { opacity: calc(var(--vignette-base, 0) + 0.15); }
      }

      /* Spotted warning flash */
      #stealth-warning {
        position: absolute;
        top: 40%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: bold;
        color: #f44;
        letter-spacing: 6px;
        text-shadow: 0 0 20px #f00, 0 0 40px #f00;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      #stealth-warning.active {
        animation: warning-flash 0.4s ease-in-out infinite alternate;
      }
      @keyframes warning-flash {
        from { opacity: 0.7; }
        to   { opacity: 1; }
      }

      /* Hidden indicator */
      #stealth-hidden {
        position: absolute;
        bottom: 70px; left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 4px;
        color: #4af;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      /* Collapse timer — large countdown at top-centre */
      #collapse-timer {
        position: absolute;
        top: 50px; left: 50%;
        transform: translateX(-50%);
        font-size: 36px;
        font-weight: bold;
        color: #f44;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #f00, 0 0 30px #f00;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #collapse-timer.active {
        opacity: 1;
        animation: timer-pulse 1s ease-in-out infinite;
      }
      @keyframes timer-pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50%      { transform: translateX(-50%) scale(1.08); }
      }
      #collapse-timer .timer-label {
        display: block;
        font-size: 10px;
        letter-spacing: 6px;
        color: #f88;
        text-align: center;
        margin-bottom: 2px;
      }

      /* Boss phase indicator */
      #boss-phase {
        position: absolute;
        top: 100px; left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 4px;
        color: #ff8844;
        text-shadow: 0 0 10px #f80;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
      }

      /* Game Over / Victory overlay */
      #gameover-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
        z-index: 25;
      }
      #gameover-title {
        font-size: 52px;
        font-weight: bold;
        letter-spacing: 8px;
        color: #f44;
        text-shadow: 0 0 30px rgba(255, 50, 50, 0.5);
        margin-bottom: 12px;
      }
      #gameover-subtitle {
        font-size: 14px;
        color: #888;
        letter-spacing: 3px;
        margin-bottom: 40px;
      }
      #gameover-overlay button {
        background: none;
        border: 1px solid #555;
        color: #ccc;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        padding: 10px 32px;
        margin: 6px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: border-color 0.2s, color 0.2s;
      }
      #gameover-overlay button:hover {
        border-color: #fff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Three.js canvas is appended here by the renderer -->
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="crosshair"></div>
      <div id="fps">-- FPS</div>
      <div id="debug-keys">Keys: none</div>
      <div id="level-indicator">LEVEL 1</div>

      <!-- Pulse Tool energy bar -->
      <div id="energy-bar-wrap">
        <div id="energy-bar-label">PULSE</div>
        <div id="energy-bar-bg">
          <div id="energy-bar-fill"></div>
        </div>
      </div>

      <!-- Health bar -->
      <div id="health-bar-wrap">
        <div id="health-bar-label">HEALTH</div>
        <div id="health-bar-bg">
          <div id="health-bar-fill"></div>
        </div>
      </div>

      <!-- Stealth HUD -->
      <div id="stealth-vignette"></div>
      <div id="stealth-warning">! DETECTED !</div>
      <div id="stealth-hidden">[ HIDDEN ]</div>

      <!-- Collapse timer (Level 3) -->
      <div id="collapse-timer">
        <span class="timer-label">FAILSAFE DETONATION</span>
        <span id="collapse-timer-value">0:00</span>
      </div>

      <!-- Boss phase indicator (Level 3) -->
      <div id="boss-phase"></div>
    </div>

    <!-- Main menu -->
    <div id="menu-overlay">
      <h1>The Core</h1>
      <div class="subtitle">Reactor Station</div>
      <button id="btn-start">Start Game</button>
      <button id="btn-credits">Credits</button>
    </div>

    <!-- Pause menu -->
    <div id="pause-overlay">
      <h2>Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart">Restart</button>
      <button id="btn-main-menu">Main Menu</button>
    </div>

    <!-- Game Over / Victory overlay -->
    <div id="gameover-overlay">
      <div id="gameover-title">GAME OVER</div>
      <div id="gameover-subtitle"></div>
      <button id="btn-retry">Retry</button>
      <button id="btn-gameover-menu">Main Menu</button>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-text">Loading</div>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
